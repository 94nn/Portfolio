name: Checks

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML
        run: npx --yes html-validate "*.html"

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress "*.html"
          fail: true
